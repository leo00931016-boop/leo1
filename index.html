<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>PACE 校園運動</title>
  <style>
    body { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; margin: 0; background: #f5f3ef; color: #1f2a27; }
    .shell { max-width: 760px; margin: 32px auto; padding: 24px; }
    .card { background: #fff; border-radius: 18px; box-shadow: 0 10px 28px rgba(0,0,0,.08); padding: 24px; }
    .dialog-head { display: flex; justify-content: space-between; align-items: center; }
    .close { border: 0; background: transparent; font-size: 28px; cursor: pointer; }
    .field-row { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 12px; margin-top: 12px; }
    label { display: block; font-size: 14px; color: #54615d; margin-bottom: 8px; }
    input, select { width: 100%; box-sizing: border-box; padding: 12px 10px; border: 1px solid #d9dcd5; border-radius: 10px; font-size: 16px; }
    .check { display: flex; align-items: center; gap: 10px; margin-top: 16px; }
    .check input { width: 18px; height: 18px; }
    .primary { background: #d95432; color: white; border: 0; border-radius: 12px; padding: 14px 22px; font-size: 16px; font-weight: 700; cursor: pointer; width: 100%; margin-top: 18px; }
    .secondary { background: #e9e9e2; border: 0; border-radius: 10px; padding: 11px 14px; cursor: pointer; }
    .message { margin-top: 12px; color: #632b1c; min-height: 24px; }
    .demo-link { margin-top: 12px; text-align: center; }
    .hidden { display: none; }
  </style>
</head>
<body>
  <div class="shell">
    <div class="card">
      <button id="openSetup" class="secondary" type="button">開啟設定</button>
      <div id="message" class="message">等待開始</div>
    </div>
  </div>

  <dialog id="setupDialog">
    <div class="dialog-head">
      <div>
        <div style="font-size:12px;letter-spacing:.18em;color:#8b908b;">BEFORE YOU GO</div>
        <h2 style="margin:6px 0 0;">準備開始</h2>
      </div>
      <button id="closeSetup" class="close" type="button" aria-label="關閉設定">×</button>
    </div>

    <form id="profile" novalidate>
      <div class="field-row">
        <div>
          <label for="alias">課堂代號</label>
          <input id="alias" name="alias" maxlength="24" placeholder="例如 A 組 07">
        </div>
        <div>
          <label for="height">身高 cm</label>
          <input id="height" name="height" type="number" min="80" max="230" value="165" required>
        </div>
        <div>
          <label for="weight">體重 kg</label>
          <input id="weight" name="weight" type="number" min="20" max="250" step="0.1" value="60" required>
        </div>
      </div>

      <div class="field-row">
        <div>
          <label for="age">年齡</label>
          <input id="age" name="age" type="number" min="6" max="100" value="20" required>
        </div>
        <div>
          <label for="mode">運動方式</label>
          <select id="mode" name="mode">
            <option value="3.5">舒適步行 · 3.5 MET</option>
            <option value="4.8">快走 · 4.8 MET</option>
            <option value="7.5">慢跑 · 7.5 MET</option>
          </select>
        </div>
        <div></div>
      </div>

      <label class="check">
        <input id="consent" name="consent" type="checkbox">
        <span>保持聯絡資訊，切換運動時會自動記錄。</span>
      </label>

      <label class="check">
        <input id="consent2" name="consent2" type="checkbox">
        <span>同意在此記錄並使用定位資料，僅用於運動紀錄與分析。</span>
      </label>

      <button id="start" class="primary" type="button">開始 GPS 運動 →</button>
      <div class="demo-link">
        <button id="demo" class="secondary" type="button">示範模式</button>
      </div>
    </form>
  </dialog>

  <script>
    const $ = (id) => document.getElementById(id);
    const KEY = 'campus-move-history-v1';
    let records = [];
    try {
      records = JSON.parse(localStorage.getItem(KEY) || '[]');
      if (!Array.isArray(records)) records = [];
    } catch {}

    const message = (text) => {
      $('message').textContent = text;
    };

    function validateConsent() {
      const consent = $('consent');
      const consent2 = $('consent2');
      if (!consent || !consent2) return true;
      if (!consent.checked || !consent2.checked) {
        message('請先勾選兩個同意條款，再開始運動。');
        return false;
      }
      return true;
    }

    function begin(demo = false) {
      if (!demo && !validateConsent()) return;

      const form = $('profile');
      const fields = [
        $('height'),
        $('weight'),
        $('age')
      ];

      for (const field of fields) {
        if (!field.value || Number(field.value) <= 0) {
          message('請填寫身高、體重與年齡。');
          field.focus();
          return;
        }
      }

      const session = {
        id: Date.now(),
        date: new Date().toISOString(),
        alias: $('alias').value.trim(),
        demo,
        mode: $('mode').value,
        height: Number($('height').value),
        weight: Number($('weight').value),
        age: Number($('age').value),
        seconds: 0,
        meters: 0,
        points: [],
        kcal: 0
      };

      records.unshift(session);
      localStorage.setItem(KEY, JSON.stringify(records));
      message(demo ? '示範模式已啟動。' : 'GPS 運動已開始。');
      $('setupDialog').close();
    }

    $('openSetup').addEventListener('click', () => $('setupDialog').showModal());
    $('closeSetup').addEventListener('click', () => $('setupDialog').close());
    $('start').addEventListener('click', () => begin(false));
    $('demo').addEventListener('click', () => begin(true));
  </script>
</body>
</html>
